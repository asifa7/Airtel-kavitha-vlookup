(() => {
'use strict';

const state={masterRows:[],masterFileName:'',masterColumns:[],masterVoiceCol:'',masterDslCol:'',lookupRows:[],lookupFileName:'',lookupColumns:[],lookupKeyCol:'',items:[],stats:null,processing:false,progress:0,tab:'ALL',query:'',page:1,pageSize:25,inspect:null,help:false,toast:null};
let toastTimer;
function toast(msg){state.toast=msg;renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;renderToast()},3500)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function norm(input){if(input==null)return{raw:'',cleanDigits:'',last10:'',prefix:'',type:'unknown'};const raw=String(input).trim();if(!raw)return{raw:'',cleanDigits:'',last10:'',prefix:'',type:'unknown'};const ims=raw.toLowerCase().includes('.ims.')||raw.toLowerCase().includes('airtel.in');let s=raw;if(ims){const m=raw.match(/^(?:\+?91|0)?([0-9]{8,12})/i)||raw.match(/([0-9]{8,12})/);if(m&&m[1])s=m[1]}
const clean=s.replace(/\D/g,'');let last10='',prefix='',type='unknown';if(clean.length>=10){last10=clean.slice(-10);prefix=clean.slice(0,-10);if(ims)type='ims_uri';else if(raw.startsWith('+91')||(clean.startsWith('91')&&clean.length===12))type='prefixed_91';else if(clean.length===11&&clean.startsWith('0'))type='std_landline';else type='mobile_10'}else if(clean) {last10=clean;type='unknown'}else{last10=raw.toLowerCase().replace(/[^a-z0-9]/g,'');type='alphanumeric'}return{raw,cleanDigits:clean,last10,prefix,type}}

function detect(cols, exact, contains){for(const p of exact){const f=cols.find(c=>c.toLowerCase().trim()===p);if(f)return f}for(const p of contains){const f=cols.find(c=>c.toLowerCase().includes(p));if(f)return f}return cols[0]||''}
function detectLookup(cols){return detect(cols,['del_number','voice_id','dsl_id','phone','mobile','contact','telephone','number','mobile_number','calling_number','account_number'],['del_number','voice_id','dsl_id','phone','mobile','contact','telephone','number','mobile_number','calling_number','account_number'])}
function detectVoice(cols){for(const p of ['voice_id','voice id','phone','contact_number','del_number','del_no']){const f=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===p.replace(/[^a-z0-9]/g,''));if(f)return f}return cols.find(c=>c.toLowerCase().includes('voice'))||cols[0]||''}
function detectDsl(cols){for(const p of ['dsl_id','dsl id','dslid','broadband_id','wifi_id','service_id']){const f=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===p.replace(/[^a-z0-9]/g,''));if(f)return f}return cols.find(c=>c.toLowerCase().includes('dsl'))||''}
function detectAccount(cols){for(const p of ['account_number','account_no','accountno','can_id','ca_number','billing_id']){const f=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===p.replace(/[^a-z0-9]/g,''));if(f)return f}return cols.find(c=>c.toLowerCase().includes('account'))||''}

function buildIndex(rows,vCol,dCol){const ten=new Map(),exact=new Map(),digits=new Map(),dslBase=new Map();const accountCol=detectAccount(Object.keys(rows[0]||{})),nameCol=detect(Object.keys(rows[0]||{}),['customer_name','name'],['customer_name','customer']),circleCol=detect(Object.keys(rows[0]||{}),['circle_name','circle'],['circle']),statusCol=detect(Object.keys(rows[0]||{}),['del_status','status'],['status']);
for(const row of rows){const vv=row[vCol];if(vv!=null&&String(vv).trim()){const s=String(vv).trim();exact.set(s.toLowerCase(),row);const n=norm(s);if(n.cleanDigits)digits.set(n.cleanDigits,row);if(n.last10&&n.last10.length>=7)ten.set(n.last10,row)}const dv=row[dCol];if(dv!=null&&String(dv).trim()){const s=String(dv).trim();exact.set(s.toLowerCase(),row);const base=s.replace(/_[a-zA-Z0-9]+$/i,'').trim();if(base){dslBase.set(base.toLowerCase(),row);const n=norm(base);if(n.last10)ten.set(n.last10,row);if(n.cleanDigits)digits.set(n.cleanDigits,row)}}const av=row[accountCol];if(av!=null&&String(av).trim()){const s=String(av).trim();exact.set(s.toLowerCase(),row);const d=s.replace(/\D/g,'');if(d)digits.set(d,row)}for(const k of masterSearchKeys(vv))if(!exact.has(k))exact.set(k,row)}return{ten,exact,digits,dslBase,vCol,dCol,accountCol,nameCol,circleCol,statusCol}}
function processRows(lookups,index,keyCol){return new Promise(resolve=>{const start=performance.now(),total=lookups.length,items=new Array(total),freq=new Map();for(const r of lookups){const x=String(r[keyCol]??'').trim().toLowerCase();if(x)freq.set(x,(freq.get(x)||0)+1)}let ok=0,no=0,dups=0;const circles={},statuses={};let i=0;const chunk=5000;function run(){const end=Math.min(i+chunk,total);for(;i<end;i++){const row=lookups[i],raw=String(row[keyCol]??'').trim(),n=norm(raw),fq=freq.get(raw.toLowerCase())||1,dup=fq>1;if(dup)dups++;let m,method='None';if(n.last10&&n.last10.length>=7){m=index.ten.get(n.last10);if(m)method='Normalized 10-Digit'}if(!m&&raw){m=index.exact.get(raw.toLowerCase());if(m)method='Exact String'}if(!m&&n.cleanDigits){m=index.digits.get(n.cleanDigits);if(m)method='Full Numeric'}if(!m&&raw){const stripped=raw.replace(/_[a-zA-Z0-9]+$/i,'').trim().toLowerCase();m=index.dslBase.get(stripped);if(m)method='DSL Prefix'}const matched=!!m;if(matched){ok++;const c=String(m[index.circleCol]||'Unknown');circles[c]=(circles[c]||0)+1;const s=String(m[index.statusCol]||'Active');statuses[s]=(statuses[s]||0)+1}else no++;items[i]={index:i+1,lookupRaw:raw,normalized10:n.last10||raw,keyType:n.type,matchStatus:matched?'MATCHED':'NOT_FOUND',isDuplicateInInput:dup,duplicateCountInInput:fq,matchedRecord:m,masterMatchesCount:matched?1:0,dslIdFound:m?String(m[index.dCol]??''):undefined,voiceIdFound:m?String(m[index.vCol]??''):undefined,accountNumberFound:m?String(m[index.accountCol]??''):undefined,customerNameFound:m?String(m[index.nameCol]??''):undefined,circleFound:m?String(m[index.circleCol]??''):undefined,statusFound:m?String(m[index.statusCol]??''):undefined,matchMethod:method,originalInputRow:row}}
state.progress=25+(total?Math.round((i/total)*75):75);render();if(i<total)setTimeout(run,0);else{const ms=Math.max(1,Math.round(performance.now()-start));state.stats={totalInputRows:total,successfullyFetched:ok,notFetched:no,duplicateCount:dups,matchRatePercent:total?Number((ok/total*100).toFixed(1)):0,durationMs:ms,rowsPerSecond:Math.round(total/(ms/1000)),circleBreakdown:circles,statusBreakdown:statuses};state.processing=false;state.progress=100;render();toast('Matching completed successfully')}}run()})}
async function runMatch(){if(!state.masterRows.length||!state.lookupRows.length)return;state.processing=true;state.progress=5;render();try{const idx=buildIndex(state.masterRows,state.masterVoiceCol,state.masterDslCol);state.progress=25;render();await processRows(state.lookupRows,idx,state.lookupKeyCol)}catch(e){state.processing=false;render();alert('Error processing data: '+(e?.message||e))}}

function parseDelimited(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/).find(x=>x.trim())||'';let delim='\t';const candidates=[',','\t',';','|'];let best=',';let bestCount=-1;for(const d of candidates){let c=0,inQ=false;for(let i=0;i<first.length;i++){if(first[i]==='"'){if(inQ&&first[i+1]==='"')i++;else inQ=!inQ}else if(first[i]===d&&!inQ)c++}if(c>bestCount){bestCount=c;best=d}}delim=best;
const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else{if(ch==='"'){q=true}else if(ch===delim){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){}else cell+=ch}}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);if(!rows.length)return{columns:[],data:[]};let headers=rows[0].map((h,i)=>{let x=String(h).trim()||'Column_'+(i+1);return x});const seen=new Map();headers=headers.map(h=>{const n=seen.get(h)||0;seen.set(h,n+1);return n?h+'_'+(n+1):h});const data=[];for(let i=1;i<rows.length;i++){const r=rows[i],obj={};headers.forEach((h,j)=>obj[h]=r[j]??'');if(Object.values(obj).some(v=>String(v).trim()!==''))data.push(obj)}return{columns:headers,data}}

async function unzipEntries(buf){
const bytes=new Uint8Array(buf),dv=new DataView(buf);
const minPos=Math.max(0,bytes.length-22-65535);
let eocd=-1;
for(let i=bytes.length-22;i>=minPos;i--){
  if(i>=0&&dv.getUint32(i,true)===0x06054b50){eocd=i;break}
}
let cdSize=0,cdOffset=0;

  cdSize=dv.getUint32(eocd+12,true);

  for(let i=bytes.length-22;i>=0;i--){

// Some ZIPs contain a prefix before the archive. Adjust offsets if needed.
let archiveAdjust=0;
if(dv.getUint32(cdOffset,true)!==0x02014b50){
  let found=-1;
  const searchFrom=Math.max(0,Math.min(bytes.length-46,cdOffset+Math.max(0,cdSize)-cdSize-1024));
  for(let i=Math.max(0,cdOffset-1024);i<Math.min(bytes.length-46,cdOffset+1024);i++){
    if(dv.getUint32(i,true)===0x02014b50){found=i;break}
  }
  if(found<0){
    for(let i=bytes.length-46;i>=0;i--){
      if(dv.getUint32(i,true)===0x02014b50){found=i;break}
    }
  }
  if(found<0)throw new Error('Invalid ZIP/XLSX file');
  archiveAdjust=found-cdOffset;
  cdOffset=found;
}

'<div><div class="upload-head"><div><div class="upload-title">FILE 2 · LOOKUP / INPUT LIST</div><div class="upload-sub">Numbers, DSL IDs or account identifiers to search</div></div><button class="btn" id="lookupbrowse">'+(s.lookupRows.length?'Change File':'Browse File')+'</button></div><div class="drop '+(s.lookupRows.length?'loaded':'')+'" id="lookupdrop">'+(s.lookupRows.length?'<div class="file-row"><span class="file-name">▤ '+esc(s.lookupFileName)+'</span><span class="count">'+s.lookupRows.length.toLocaleString()+' rows</span></div><div class="mapping"><label>Lookup query column</label><select class="select" id="lookupcol">'+optionList(s.lookupColumns,s.lookupKeyCol)+'</select></div>':'<div><div class="drop-icon">⇧</div><strong>Click to upload Lookup File</strong><small>Single or multi-column file (del_number / phone)</small></div>')+'</div></div></div>'+ 
'<div class="ready"><div class="hint">'+(!has?'Upload both files to begin.':(!can&&!s.processing?'<span class="danger">⚠ Please provide both files and valid columns.</span>':'✓ Ready to process '+s.lookupRows.length.toLocaleString()+' lookup numbers against '+s.masterRows.length.toLocaleString()+' master records.'))+'</div><button class="btn btn-red" id="run" '+(!can||s.processing?'disabled':'')+'>'+(s.processing?'⟳ Processing… '+s.progress+'%':'⚡ Run Normalized VLOOKUP Match →')+'</button></div>'+(s.processing?'<div class="progress"><div class="progress-row"><span>Executing O(1) in-memory hash calculation…</span><b>'+s.progress+'%</b></div><div class="bar"><i style="width:'+s.progress+'%"></i></div></div>':'')+'</section>'+ 
(s.stats?statsHtml(s.stats):'')+(s.items.length?resultsHtml(s,items,pages):'')+'</main><div id="toast"></div>'+(s.inspect?inspectModal(s):'')+(s.help?helpModal():'')}
function inspectModal(it){const m=it.matchedRecord||{};const fields=[['Input Query',it.lookupRaw],['Normalized 10-Digit',it.normalized10],['Match Method',it.matchMethod],['DSL ID',it.dslIdFound||'NOT FOUND'],['Voice ID',it.voiceIdFound||''],['Account Number',it.accountNumberFound||''],['Customer Name',it.customerNameFound||''],['Circle',it.circleFound||''],['Status',it.statusFound||'']];return `<div class="modal-bg"><div class="modal"><div class="modal-head"><div><h3>Record Details &amp; Lookup Result</h3><p>Input query: ${esc(it.lookupRaw)}</p></div><button class="close" id="closemodal">×</button></div><div class="modal-body"><div class="rule"><h4>${it.matchStatus==='MATCHED'?'✓ MATCH SUCCESSFUL':'⚠ NOT FOUND IN MASTER DATABASE'}</h4><p>${it.matchStatus==='MATCHED'?'Matched using logic: '+esc(it.matchMethod):'No matching Voice ID, DSL ID, or 10-digit number located.'}</p></div><div class="detail-grid">${fields.map(([k,v])=>`<div class="detail"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="rule" style="margin-top:12px"><h4>Original Input Row</h4><div class="codebox">${esc(JSON.stringify(it.originalInputRow,null,2))}</div></div>${it.matchedRecord?`<div class="rule"><h4>Matched Master Record</h4><div class="codebox">${esc(JSON.stringify(m,null,2))}</div></div>`:''}</div><div class="modal-foot"><button class="btn btn-red" id="closemodal2">Close</button></div></div></div>`}
function helpModal(){return `<div class="modal-bg"><div class="modal"><div class="modal-head"><div><h3>How Telecom VLOOKUP &amp; Normalization Works</h3><p>Rules, Indian phone standards and performance</p></div><button class="close" id="closehelp">×</button></div><div class="modal-body"><div class="rule"><h4>1. Last 10 Digits Standardization</h4><p>Inputs may contain +91, leading 0 STD codes, IMS/SIP domains or DSL suffixes. The matcher strips non-digits and uses the last 10 digits when available.</p><div class="codebox">01141437857 → 1141437857</div><div class="codebox">912246192580 → 2246192580</div><div class="codebox">+914045077795ap.ims.airtel.in → 4045077795</div></div><div class="rule"><h4>2. Multi-Tier Matching</h4><p><b>Tier 1:</b> normalized last-10-digit match.</p><p><b>Tier 2:</b> exact raw string match.</p><p><b>Tier 3:</b> cleaned numeric match.</p><p><b>Tier 4:</b> DSL base match with <span class="mono">_wifi</span> removed.</p><p>Master Voice ID, DSL ID and Account Number are indexed in browser memory for fast lookups.</p></div><div class="rule"><h4>3. Large Files</h4><p>The lookup pass is chunked in batches of 5,000 so the browser can update progress instead of freezing on large lists. The master data is pre-indexed with JavaScript Map objects, giving average O(1) lookup time.</p></div><div class="rule"><h4>4. Privacy</h4><p>Your selected files are processed locally in this HTML page. There is no server upload in this standalone version.</p></div></div><div class="modal-foot"><button class="btn btn-red" id="closehelp2">Got It</button></div></div></div>`}
function bind(){const $=id=>document.getElementById(id);const addDrop=(id,kind)=>{const el=$(id);if(!el)return;el.addEventListener('dragover',e=>{e.preventDefault();el.style.borderColor='#ef4444';el.style.background='#fff7f7'});el.addEventListener('dragleave',()=>{el.style.borderColor='';el.style.background=''});el.addEventListener('drop',async e=>{e.preventDefault();el.style.borderColor='';el.style.background='';const f=e.dataTransfer?.files?.[0];if(!f)return;try{const p=await parseFile(f);kind==='master'?setMaster(p,f.name):setLookup(p,f.name)}catch(err){alert('Error reading file: '+(err?.message||err))}})};addDrop('masterdrop','master');addDrop('lookupdrop','lookup');$('help')?.addEventListener('click',()=>{state.help=true;render()});$('reset')?.addEventListener('click',reset);$('masterbrowse')?.addEventListener('click',()=>fileInput('master'));$('lookupbrowse')?.addEventListener('click',()=>fileInput('lookup'));$('masterdrop')?.addEventListener('click',e=>{if(e.target.closest('select')||e.target.closest('.file-row'))return;fileInput('master')});$('lookupdrop')?.addEventListener('click',e=>{if(e.target.closest('select')||e.target.closest('.file-row'))return;fileInput('lookup')});$('voicecol')?.addEventListener('change',e=>{state.masterVoiceCol=e.target.value;state.items=[];state.stats=null;render()});$('dslcol')?.addEventListener('change',e=>{state.masterDslCol=e.target.value;state.items=[];state.stats=null;render()});$('lookupcol')?.addEventListener('change',e=>{state.lookupKeyCol=e.target.value;state.items=[];state.stats=null;render()});$('run')?.addEventListener('click',runMatch);$('quickxlsx')?.addEventListener('click',exportExcel);$('quickcsv')?.addEventListener('click',exportCsv);$('xlsx')?.addEventListener('click',exportExcel);$('csv')?.addEventListener('click',exportCsv);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.page=1;render()}));$('search')?.addEventListener('input',e=>{state.query=e.target.value;state.page=1;render();const el=$('search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}});$('pagesize')?.addEventListener('change',e=>{state.pageSize=Number(e.target.value);state.page=1;render()});$('prev')?.addEventListener('click',()=>{if(state.page>1){state.page--;render()}});$('next')?.addEventListener('click',()=>{state.page++;render()});document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.copy)));document.querySelectorAll('[data-inspect]').forEach(b=>b.addEventListener('click',()=>{const it=state.items.find(x=>x.index===Number(b.dataset.inspect));state.inspect=it;render()}));$('closemodal')?.addEventListener('click',()=>{state.inspect=null;render()});$('closemodal2')?.addEventListener('click',()=>{state.inspect=null;render()});$('closehelp')?.addEventListener('click',()=>{state.help=false;render()});$('closehelp2')?.addEventListener('click',()=>{state.help=false;render()})}

document.addEventListener('DOMContentLoaded',()=>{render()});
})();
</script></body></html>
